[versions]
agp = "8.8.0"
buildkonfigGradlePlugin = "0.13.3"
cardview = "1.0.0"
converterScalars = "2.9.0"
firebaseMessaging = "24.1.0"
googleMaterial = "1.7.0"
googleServices = "4.4.2"
kotlin = "1.9.24"
